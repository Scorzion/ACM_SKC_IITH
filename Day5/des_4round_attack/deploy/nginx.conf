# Front proxy for the DES oracle.
#
# X-Forwarded-For is set to $remote_addr (the real TCP peer) and NOT
# $proxy_add_x_forwarded_for, so any client-supplied X-Forwarded-For header is
# discarded. This prevents students from spoofing their IP to bypass the
# per-IP query limit.

server {
    listen 80;
    server_name _;

    # Keep request/response bodies small; the oracle only takes 16 hex chars.
    client_max_body_size 8k;

    location / {
        proxy_pass http://oracle:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
